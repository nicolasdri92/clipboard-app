<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clipboard</title>
    <script>
      // Aplica el tema antes del primer pintado para evitar el parpadeo.
      try {
        var t = localStorage.getItem("clipboard-theme");
        if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "oscuro" : "claro";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div class="app">
      <header class="titlebar" data-tauri-drag-region>
        <div class="brand" data-tauri-drag-region>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3" width="9" height="11" rx="1.6"/><path d="M6 3V2.4c0-.5.4-.9.9-.9h2.2c.5 0 .9.4.9.9V3"/><line x1="6" y1="7.5" x2="10" y2="7.5"/><line x1="6" y1="10" x2="9" y2="10"/></svg>
          <span data-tauri-drag-region>Clipboard</span>
        </div>
        <div class="search-wrap" data-tauri-drag-region>
          <label class="search">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><line x1="10.5" y1="10.5" x2="14" y2="14"/></svg>
            <input id="search" placeholder="Buscar" spellcheck="false" autocomplete="off" />
            <button id="search-clear" class="search-clear" aria-label="Limpiar búsqueda" hidden>
              <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="4" y1="4" x2="12" y2="12"/><line x1="12" y1="4" x2="4" y2="12"/></svg>
            </button>
            <span id="search-kbd" class="kbd">Ctrl K</span>
          </label>
        </div>
        <div class="actions" data-tauri-drag-region>
          <button id="theme" class="icon-btn" aria-label="Cambiar tema" title="Cambiar tema"></button>
        </div>
        <div class="winctl">
          <button id="win-min" class="win-min" aria-label="Minimizar">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.1"><line x1="3.5" y1="8" x2="12.5" y2="8"/></svg>
          </button>
          <button id="win-close" class="win-close" aria-label="Cerrar">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.1"><line x1="4" y1="4" x2="12" y2="12"/><line x1="12" y1="4" x2="4" y2="12"/></svg>
          </button>
        </div>
      </header>
      <main id="content" class="content"></main>
      <div id="panel-root"></div>
      <div id="toast-root"></div>
    </div>
  </body>
</html>
